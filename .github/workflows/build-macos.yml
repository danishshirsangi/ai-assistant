name: Build macOS app
run-name: 'Build macOS app #${{ github.run_number }}'

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-app-build
  cancel-in-progress: false

jobs:
  build:
    name: Build Apple Silicon app
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Check out latest main
        uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          architecture: arm64
          cache: pip
          cache-dependency-path: requirements-macos-build.txt

      - name: Verify Apple Silicon build environment
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner architecture: $(uname -m)"
          if [[ "$(uname -m)" != "arm64" ]]; then
            echo "::error::This app must be built on an Apple Silicon runner."
            exit 1
          fi
          python --version
          swiftc --version
          xcode-select -p
          df -h .

      - name: Build the .app and .dmg
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_BIN="$(python -c 'import sys; print(sys.executable)')" ./build_macos_app.sh

      - name: Package app and create checksums
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="dist/AI Meeting Assistant.app"
          DMG_PATH="dist/AI Meeting Assistant.dmg"

          test -d "$APP_PATH"
          test -s "$DMG_PATH"

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" "dist/AI Meeting Assistant.app.zip"

          cd dist
          shasum -a 256 \
            "AI Meeting Assistant.dmg" \
            "AI Meeting Assistant.app.zip" \
            > SHA256SUMS.txt

      - name: Record source revision
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: AI-Meeting-Assistant-macOS-arm64-${{ github.run_number }}
          path: |
            dist/AI Meeting Assistant.dmg
            dist/AI Meeting Assistant.app.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable GitHub prerelease
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: macos-build-${{ github.run_id }}-${{ github.run_attempt }}
          target_commitish: main
          name: 'AI Meeting Assistant macOS build #${{ github.run_number }}'
          body: |
            Automated Apple Silicon build of AI Meeting Assistant.

            - Source branch: `main`
            - Source commit: `${{ steps.source.outputs.sha }}`
            - Runner: GitHub-hosted macOS 15 ARM64
            - Minimum macOS version: 13.0

            This build is unsigned and not notarized. On first launch, macOS may require Control-click > Open.
          files: |
            dist/AI Meeting Assistant.dmg
            dist/AI Meeting Assistant.app.zip
            dist/SHA256SUMS.txt
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
